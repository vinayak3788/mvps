<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - DeepSeek</title>
    <style>
        :root {
            --primary: #1a73e8;
            --primary-hover: #1765cc;
            --text-main: #202124;
            --text-secondary: #5f6368;
            --border: #dadce0;
            --error: #d32f2f;
            --bg: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 2px 6px 2px rgba(60,64,67,0.15);
            padding: 48px 40px 36px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-title {
            color: var(--text-main);
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 400;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            position: relative;
        }

        .auth-input {
            width: 100%;
            height: 56px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }

        .auth-input:focus {
            border-color: var(--primary);
            border-width: 2px;
            padding: 15px;
        }

        .auth-button {
            width: 100%;
            height: 48px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .auth-button:hover {
            background: var(--primary-hover);
        }

        .auth-footer {
            text-align: center;
            margin-top: 32px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .auth-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .error-message {
            color: var(--error);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Create your account</h1>
            <p class="auth-subtitle">Get started with DeepSeek</p>
        </div>

        <form id="signup-form" class="auth-form">
            <!-- Email Fields -->
            <div class="input-group">
                <input type="email" id="email" class="auth-input" placeholder="Email address" required>
                <div id="email-error" class="error-message"></div>
            </div>

            <!-- Password Field -->
            <div class="input-group">
                <input type="password" id="password" class="auth-input" placeholder="Password" required>
                <div id="password-error" class="error-message"></div>
            </div>

            <button type="submit" id="submit-btn" class="auth-button">Continue</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}" class="auth-link">Sign in</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="{{ url_for('static', filename='firebase-config.js') }}"></script>

    <script>
        // Initialize Firebase only once
        if (!window.auth) {
            window.auth = firebase.auth();
        }

        // Form submission
        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            clearErrors();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (!validateEmail(email)) {
                    showError('email-error', 'Enter a valid email address');
                    return;
                }
                if (password.length < 8) {
                    showError('password-error', 'Use 8 characters or more for your password');
                    return;
                }

                const userCredential = await window.auth.createUserWithEmailAndPassword(email, password);
                await userCredential.user.sendEmailVerification();

                // Show success message (like DeepSeek does)
                alert('Verification email sent to ' + email + '\nPlease check your inbox to verify your account.');
                window.location.href = "/welcome";
            } catch (error) {
                console.error("Auth error:", error);
                showError('email-error', error.message);
            }
        });

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }

        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
            });
        }
    </script>
</body>
</html>
